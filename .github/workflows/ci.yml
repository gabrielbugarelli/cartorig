name: CartoRig rewrite core
on:
  push:
    branches: ["rewrite/fusion-v2-from-scratch"]
  pull_request:
    paths: ["src/**", "tests/**", ".github/workflows/ci.yml"]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run scene contracts
        run: lua5.4 tests/test_scene.lua .
      - name: Run motion contracts
        run: lua5.4 tests/test_motion.lua .
