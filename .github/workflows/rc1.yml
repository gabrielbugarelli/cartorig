name: CartoRig Fusion RC1 - Build and Test
on:
  push:
    branches:
      - release/1.0-rc1-fusion-rewrite
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/openfx
          ref: OFX_Release_1_4_TAG
          path: sdk/openfx
      - name: Configure C++20
        run: cmake -S . -B build
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: C++ unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Natural Earth offline fixture tests
        run: python -m unittest discover -s tests -p "test_builder.py" -v
      - name: Offline Windows installer and tamper regression
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tests/test_install_preflight.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer preflight regressions failed." }
      - name: Stage Windows OFX binary
        shell: pwsh
        run: |
          $binary=Get-ChildItem -Path build -Recurse -Filter CartoRigFusion.ofx -File | Select-Object -First 1
          if(-not $binary){throw "CartoRig OFX not compiled"}
          New-Item -ItemType Directory -Force -Path stage-ofx | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination stage-ofx/CartoRigFusion.ofx
      - name: Save Windows OFX artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Fusion-RC1-OFX-Windows
          path: stage-ofx/CartoRigFusion.ofx
          if-no-files-found: error
          retention-days: 7
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/openfx
          ref: OFX_Release_1_4_TAG
          path: sdk/openfx
      - name: Configure C++20
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --parallel 2
      - name: C++ unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Natural Earth offline fixture tests
        run: python3 -m unittest discover -s tests -p "test_builder.py" -v
      - name: Install Lua test interpreter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Syntax check the Scene scripts
        run: |
          luac5.4 -p fusion/CartoRigSupport/scene.lua
          luac5.4 -p fusion/CartoRigSupport/scene_tree.lua
          luac5.4 -p "fusion/CartoRig Scene.lua"
          luac5.4 -p tests/test_scene.lua
          luac5.4 -p tests/test_scene_tree.lua
      - name: Mock-host Scene contract tests
        run: |
          lua5.4 tests/test_scene.lua
          lua5.4 tests/test_scene_tree.lua
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/openfx
          ref: OFX_Release_1_4_TAG
          path: sdk/openfx
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Compile
        run: cmake --build build-sanitize --parallel 2
      - name: Execute ASan and UBSan tests
        run: ctest --test-dir build-sanitize --output-on-failure
  publisher-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire Natural Earth 10m during package build ONLY
        run: python3 tools/build_ne.py --archives build-datasets --out dist/data --online-build
      - name: Verify complete essential data categories
        run: |
          python3 -c "import json; m=json.load(open('dist/data/manifest.json')); assert m['features']>5000; assert len(m['datasets'])==4; assert not m['network_required_by_runtime']"
      - name: Bundle publisher data for offline installer
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Fusion-RC1-NaturalEarth10m
          path: dist/data/
          retention-days: 7
          if-no-files-found: error

  packaging-windows:
    needs: [windows, publisher-data]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download official Natural Earth bundle
        uses: actions/download-artifact@v4
        with:
          name: CartoRig-Fusion-RC1-NaturalEarth10m
          path: incoming/data
      - name: Download compiled Windows OFX
        uses: actions/download-artifact@v4
        with:
          name: CartoRig-Fusion-RC1-OFX-Windows
          path: incoming/native
      - name: Assemble offline Windows installer ZIP
        shell: pwsh
        run: |
          $root='package'
          $contents=Join-Path $root 'CartoRigFusion.ofx.bundle/Contents'
          $resources=Join-Path $contents 'Resources/data'
          $binary=Join-Path $contents 'Win64'
          $scripts=Join-Path $root 'Fusion/Scripts/Comp'
          New-Item -ItemType Directory -Force -Path $resources,$binary,$scripts | Out-Null
          Copy-Item -LiteralPath 'incoming/native/CartoRigFusion.ofx' -Destination (Join-Path $binary 'CartoRigFusion.ofx')
          foreach($file in @('catalog.tsv','geometry.crgeo','manifest.json')){
            Copy-Item -LiteralPath (Join-Path 'incoming/data' $file) -Destination (Join-Path $resources $file)
          }
          Copy-Item -LiteralPath 'fusion/CartoRig Scene.lua' -Destination (Join-Path $scripts 'CartoRig Scene.lua')
          Copy-Item -LiteralPath 'fusion/CartoRigSupport' -Destination (Join-Path $scripts 'CartoRigSupport') -Recurse
          Copy-Item -LiteralPath 'install/Install-CartoRig.ps1' -Destination (Join-Path $root 'Install-CartoRig.ps1')
          Copy-Item -LiteralPath 'install/Install-CartoRig.cmd' -Destination (Join-Path $root 'Install-CartoRig.cmd')
          Copy-Item -LiteralPath README.md -Destination (Join-Path $root 'README.md')
          $sha=([string]$env:GITHUB_SHA).Substring(0,10)
          $name="CartoRig-Fusion-RC1-Development-$sha.zip"
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $name -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $zip=[System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) $name))
          try {
            $paths=@($zip.Entries | ForEach-Object FullName)
            foreach($must in @('Install-CartoRig.cmd','Install-CartoRig.ps1',
              'CartoRigFusion.ofx.bundle/Contents/Win64/CartoRigFusion.ofx',
              'CartoRigFusion.ofx.bundle/Contents/Resources/data/manifest.json',
              'CartoRigFusion.ofx.bundle/Contents/Resources/data/geometry.crgeo',
              'CartoRigFusion.ofx.bundle/Contents/Resources/data/catalog.tsv',
              'Fusion/Scripts/Comp/CartoRig Scene.lua',
              'Fusion/Scripts/Comp/CartoRigSupport/scene.lua',
              'Fusion/Scripts/Comp/CartoRigSupport/scene_tree.lua')){
              if($paths -notcontains $must){throw "Missing packaged path: $must"}
            }
          } finally { $zip.Dispose() }
      - name: Verify offline installer payload using Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "package/Install-CartoRig.ps1" -VerifyPackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Offline installer preflight rejected the assembled package." }
      - name: Publish development package (not a stable RC)
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Fusion-RC1-Development-Windows
          path: CartoRig-Fusion-RC1-Development-*.zip
          if-no-files-found: error
          retention-days: 7
