name: CartoRig greenfield source checks
on:
  push:
    branches: ["rewrite/fusion-first-greenfield-poc"]
  workflow_dispatch:
jobs:
  lua-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua scene runtime and native host mock
        run: lua5.4 tests/test_runtime.lua .
      - name: Editor startup and missing MediaOut diagnostics mock
        run: lua5.4 tests/test_editor_startup.lua .
      - name: Catalog and naming contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish Windows offline installation package
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-FusionFirst-Windows-Alpha
          path: |
            fusion/**
            packaging/*.cmd
            README.md
            docs/Resolve20-acceptance.md
          if-no-files-found: error
