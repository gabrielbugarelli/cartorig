name: Natural Earth offline backend checks
on:
  push:
    branches: [feat/natural-earth-offline-data]
  pull_request:
    paths:
      - "tools/natural_earth/**"
      - "tests/test_natural_earth.py"
      - "data/natural-earth/**"
      - ".github/workflows/natural-earth.yml"
  workflow_dispatch:
jobs:
  offline-data-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise offline builder without network
        run: python -m unittest discover -s tests -p "test_natural_earth*.py" -v
      - name: Assert pinned official layer manifest
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/natural-earth/vector_layers_v5.1.2.json",encoding="utf-8"))
          assert d["layer_count"]==len(d["layers"])==215
          assert len({x["source_path"] for x in d["layers"]})==215
          assert all(x["status"]=="expected_not_installed" for x in d["layers"])
          assert sum(d["summary"].values())==215
          print("PASS: 215 upstream vector layers, none falsely marked imported")
          PY

  source-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enumerate the eight official source pages and raster families
        continue-on-error: true
        run: |
          mkdir -p build/natural-earth
          python tools/natural_earth/inventory.py --output build/natural-earth/official_sources.json
      - name: Verify a real 110m Shapefile archive from the publisher
        continue-on-error: true
        run: python -m tools.natural_earth.smoke
      - name: Upload actual publisher archive verification (small smoke only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaturalEarth-110m-Archive-Smoke
          path: build/natural-earth/smoke/
          if-no-files-found: warn
      - name: Always preserve the official source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaturalEarth-Source-Audit
          path: build/natural-earth/official_sources.json
          if-no-files-found: warn

  # Triggers only for a deliberately tagged one-off commit; never for regular
  # C++ iterations or the installed Resolve plugin.
  full-vector-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gpkg-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify the REAL published vector GeoPackage
        run: python -m tools.natural_earth.probe_gpkg
      - name: Save feature count and source SHA evidence, never the large GPKG itself
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaturalEarth-Real-GeoPackage-Probe
          path: build/natural-earth/gpkg-probe/gpkg-probe.json
          if-no-files-found: warn
